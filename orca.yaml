# orca.yaml — setup script run when Orca creates a worktree.
#
# Orca (a worktree-native IDE for parallel agents) runs scripts.setup whenever it
# creates a new worktree. This file is committed, so the whole team shares it.
#
# Injected environment variables:
#   $ORCA_ROOT_PATH     — main checkout (root repo) path; the source for copying gitignored local files
#   $ORCA_WORKTREE_PATH — the newly created worktree path; the copy target and the setup working directory

scripts:
  setup: |
    # -u aborts on an unset ORCA_* variable; cd pins every step to the new worktree.
    set -eu
    cd "$ORCA_WORKTREE_PATH"
    # 1. Trust the new worktree's mise.toml (trust is per-path) and install its pinned tools (node, bun).
    mise trust --quiet
    mise install
    # 2. Copy gitignored local files (.env*, .claude/settings.local.json, ...) from the main checkout,
    #    as listed in .worktreeinclude.
    mise exec -- bunx @pleaseai/worktreeinclude@0.1.0 "$ORCA_ROOT_PATH" "$ORCA_WORKTREE_PATH"
    # 3. Install dependencies inside the worktree.
    mise exec -- bun install
